name: Build and Check Pipeline
# IMPORTANT: This workflow name is referenced by auto-review.yml's workflow_run trigger
# If you rename this workflow, update the reference in auto-review.yml accordingly

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  CRAN: https://p3m.dev/cran/__linux__/noble/latest
  BIOC_VERSION: devel

jobs:
  build-check:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'AI review') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@biocreview'))
    runs-on: ubuntu-24.04
    container: ghcr.io/bioconductor/bioconductor_docker:devel

    steps:
      - name: Resolve submission metadata from issue body
        id: resolve
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.issue.body || "";

            const repoMatch = body.match(/^[\-\*\s]*Repository:\s*https?:\/\/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)\/?\s*$/im)
              || body.match(/github\.com\/([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)/);
            if (!repoMatch) {
              core.setFailed("No valid Repository URL found. Use 'Repository: https://github.com/owner/repo' in the issue body.");
              return;
            }

            const refMatch = body.match(/^[\-\*\s]*(?:Branch\/Ref|Ref):\s*([\w\/\.\-]+)\s*$/im);
            const ref = refMatch ? refMatch[1].trim() : "devel";

            core.setOutput('repo', repoMatch[1]);
            core.setOutput('ref', ref || 'devel');
            core.setOutput('issue', String(context.issue.number));

      - name: Resolve checkout ref (fallback to repository default branch)
        id: resolve_ref
        uses: actions/github-script@v8
        with:
          script: |
            const [owner, repo] = '${{ steps.resolve.outputs.repo }}'.split('/');
            const requestedRef = '${{ steps.resolve.outputs.ref }}' || 'devel';

            let selectedRef = requestedRef;
            let fallbackUsed = false;

            try {
              await github.rest.repos.getBranch({ owner, repo, branch: requestedRef });
            } catch (e) {
              const repoInfo = await github.rest.repos.get({ owner, repo });
              selectedRef = repoInfo.data.default_branch;
              fallbackUsed = true;
            }

            core.setOutput('selected_ref', selectedRef);
            core.setOutput('fallback_used', String(fallbackUsed));

      - name: Parse LLM model from comment
        id: parse_model
        uses: actions/github-script@v8
        with:
          script: |
            let model = 'gemini-3.1-pro-preview';  // default

            if (context.eventName === 'issue_comment') {
              const commentBody = context.payload.comment.body || '';
              // Match: @biocreview <model-name>
              // Accepts any model name starting with gemini or gpt
              const modelMatch = commentBody.match(/@biocreview\s+((?:gemini|gpt)[\w.-]*)/i);

              if (modelMatch) {
                model = modelMatch[1];
              }
            }

            core.setOutput('model', model);
            console.log(`LLM model selected: ${model}`);

      - name: Initialize artifact and metadata files
        run: |
          : > check_results.txt
          : > bioccheck_results.txt
          : > coverage_summary.txt
          : > pkgndep_results.txt
          echo "{}" > coverage.json

          echo "${{ steps.resolve.outputs.issue }}" > issue_number.txt
          echo "${{ steps.resolve.outputs.repo }}" > target_repo.txt
          echo "${{ steps.resolve_ref.outputs.selected_ref }}" > target_ref.txt
          echo "${{ steps.parse_model.outputs.model }}" > llm_model.txt

          if [ "${{ steps.resolve_ref.outputs.fallback_used }}" = "true" ]; then
            echo "[INFO] Requested ref was not found; checkout used repository default branch." >> check_results.txt
          fi

      - name: Parse remotes from comment (optional)
        id: parse_remotes
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== 'issue_comment') {
              core.setOutput('found_remotes', '');
              return;
            }

            const commentBody = context.payload.comment.body || '';
            const remotesMatch = commentBody.match(/^Remotes:\s*(.+)$/im);

            if (!remotesMatch) {
              core.setOutput('found_remotes', '');
              return;
            }

            core.setOutput('found_remotes', remotesMatch[1].trim());

      - name: Extract package name from repo
        id: pkg_name
        run: |
          REPO="${{ steps.resolve.outputs.repo }}"
          PKG_NAME="${REPO##*/}"
          echo "name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PKG_NAME"

      - name: Checkout target package
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve_ref.outputs.selected_ref }}
          path: ${{ steps.pkg_name.outputs.name }}

      - name: Install remotes
        run: BiocManager::install("remotes", ask = FALSE, update = FALSE)
        shell: Rscript {0}

      - name: Install co-dependent remotes
        if: steps.parse_remotes.outputs.found_remotes != ''
        env:
          REMOTES_INPUT: ${{ steps.parse_remotes.outputs.found_remotes }}
        run: |
          deps <- trimws(strsplit(Sys.getenv("REMOTES_INPUT"), ",\\s*")[[1L]])
          deps <- deps[nzchar(deps)]
          if (length(deps) > 0) {
            options(repos = c(CRAN = Sys.getenv("CRAN")))
            message("Installing remotes: ", paste(deps, collapse = ", "))
            remotes::install_github(deps, upgrade = "never")
          }
        shell: Rscript {0}

      - name: Install build/check dependencies
        run: |
          options(repos = c(CRAN = Sys.getenv("CRAN")))
          BiocManager::install(c("BiocCheck", "rcmdcheck", "covr", "jsonlite", "remotes", "cyclocomp", "pkgndep"), ask = FALSE, update = FALSE)
          remotes::install_local("${{ steps.pkg_name.outputs.name }}", dependencies = TRUE, repos = BiocManager::repositories())
        shell: Rscript {0}

      - name: R CMD check
        continue-on-error: true
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
        run: |
          check <- tryCatch(
            rcmdcheck::rcmdcheck("${{ steps.pkg_name.outputs.name }}", args = "--no-manual", error_on = "never", check_dir = "check"),
            error = function(e) {
              message("rcmdcheck failed: ", conditionMessage(e))
              NULL
            }
          )
          if (!is.null(check)) {
            log_files <- list.files("check", pattern = "00check\\.log$", recursive = TRUE, full.names = TRUE)
            if (length(log_files) > 0) {
              file.copy(log_files[1], "check_results.txt", overwrite = TRUE)
            } else {
              sink("check_results.txt")
              print(check)
              sink()
            }
          }
        shell: Rscript {0}

      - name: Test coverage
        continue-on-error: true
        run: |
          result <- tryCatch({
            cov <- covr::package_coverage("${{ steps.pkg_name.outputs.name }}", quiet = FALSE, clean = TRUE, type = "all")
            if (!is.null(cov) && inherits(cov, "coverage")) {
              cov_list <- covr::coverage_to_list(cov)
              jsonlite::write_json(cov_list, "coverage.json", auto_unbox = TRUE, pretty = TRUE)
              pct <- round(covr::percent_coverage(cov), 2)
              writeLines(paste0("Total Coverage: ", pct, "%"), "coverage_summary.txt")
              message("Coverage analysis completed successfully: ", pct, "%")
            } else {
              writeLines("Coverage analysis returned NULL or invalid result.", "coverage_summary.txt")
            }
          }, error = function(e) {
            err_msg <- paste0("Coverage analysis failed: ", conditionMessage(e))
            message(err_msg)
            writeLines(err_msg, "coverage_summary.txt")
          })
        shell: Rscript {0}

      - name: Run cyclocomp
        continue-on-error: true
        run: |
          pkg_dir <- "${{ steps.pkg_name.outputs.name }}"
          pkg_name <- read.dcf(file.path(pkg_dir, "DESCRIPTION"), fields = "Package")[1L, "Package"]
          tryCatch({
            result <- cyclocomp::cyclocomp_package(pkg_name)
            if (!is.null(result) && nrow(result) > 0L) {
              write.csv(result, "cyclocomp_results.csv", row.names = FALSE)
              message("cyclocomp: ", nrow(result), " functions analyzed")
            }
          }, error = function(e) {
            message("cyclocomp failed: ", conditionMessage(e))
          })
        shell: Rscript {0}

      - name: Run pkgndep
        id: pkgndep
        continue-on-error: true
        run: |
          pkg_dir <- "${{ steps.pkg_name.outputs.name }}"
          tryCatch({
            result <- pkgndep::pkgndep(pkg_dir)
            writeLines(utils::capture.output(print(result)), "pkgndep_results.txt")
            grDevices::png("pkgndep_histogram.png", width = 900, height = 600, res = 120)
            plot(result)
            grDevices::dev.off()
            cat("histogram_generated=true\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            message("pkgndep analysis complete")
          }, error = function(e) {
            cat("histogram_generated=false\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
            message("pkgndep failed: ", conditionMessage(e))
          })
        shell: Rscript {0}

      - name: Clean up intermediate vignette files
        run: |
          # Remove only untracked (newly built) HTML/PDF files from vignettes directory
          # This preserves any HTML/PDF files that were actually committed to the repo
          cd "${{ steps.pkg_name.outputs.name }}"
          git ls-files --others --exclude-standard vignettes/ | grep -E '\.(html|pdf)$' | xargs -r rm -v
          cd ..
          echo "Cleaned up intermediate vignette files (untracked only)"

      - name: Install GPG
        run: sudo apt-get update && sudo apt-get install -y gpg

      - name: Run BiocCheck
        continue-on-error: true
        run: |
          Rscript -e "BiocCheck::BiocCheck('${{ steps.pkg_name.outputs.name }}', \`quit-with-status\` = FALSE, \`no-check-bioc-help\` = TRUE)" > bioccheck_results.txt 2>&1 || true

      - name: Upload build-check results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-results
          path: |
            check_results.txt
            bioccheck_results.txt
            coverage.json
            coverage_summary.txt
            cyclocomp_results.csv
            pkgndep_results.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build-check metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-check-metadata
          path: |
            issue_number.txt
            target_repo.txt
            target_ref.txt
            llm_model.txt
          retention-days: 7

      - name: Upload pkgndep histogram artifact
        id: upload-histogram
        if: always() && steps.pkgndep.outputs.histogram_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pkgndep-histogram
          path: pkgndep_histogram.png
          retention-days: 30

      - name: Post build/check summary to issue
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const readOrDefault = (path, fallback) => {
              if (!fs.existsSync(path)) return fallback;
              const txt = fs.readFileSync(path, 'utf8');
              return txt.trim().length > 0 ? txt : fallback;
            };

            const shorten = (text, max = 12000) =>
              text.length > max ? `${text.slice(0, max)}\n\n[...truncated; see full results in run artifacts]` : text;

            const check = shorten(readOrDefault('check_results.txt', 'No check log found. See run artifacts.'));
            const bioc = shorten(readOrDefault('bioccheck_results.txt', 'No BiocCheck log found. See run artifacts.'));
            const cov = fs.existsSync('coverage_summary.txt') ? fs.readFileSync('coverage_summary.txt', 'utf8') : 'No coverage found.';
            const pkgndep = shorten(readOrDefault('pkgndep_results.txt', 'Dependency load analysis not available.'));

            let cycloSummary = 'Cyclomatic complexity results not available.';
            if (fs.existsSync('cyclocomp_results.csv')) {
              const csv = fs.readFileSync('cyclocomp_results.csv', 'utf8').trim();
              const lines = csv.split('\n').slice(1).filter(l => l.trim());
              if (lines.length > 0) {
                const data = lines.map(l => {
                  const m = l.match(/^"([^"]*)",(\d+)/);
                  return m ? { name: m[1], cyclocomp: Number(m[2]) } : null;
                }).filter(Boolean);
                if (data.length > 0) {
                  const vals = data.map(r => r.cyclocomp);
                  const max = Math.max(...vals);
                  const mean = vals.length > 0
                    ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(2)
                    : '0';
                  const high = data.filter(r => r.cyclocomp > 10).sort((a, b) => b.cyclocomp - a.cyclocomp);
                  cycloSummary = `Functions: ${data.length} | Mean: ${mean} | Max: ${max}`;
                  if (high.length > 0) {
                    const items = high.slice(0, 5).map(r => `${r.name} (${r.cyclocomp})`).join(', ');
                    cycloSummary += `\nHigh complexity (>10): ${items}`;
                  } else {
                    cycloSummary += '\nNo functions with cyclomatic complexity > 10.';
                  }
                }
              }
            }

            const body = `### Build & Check Results\n\nFull logs and artifacts: ${runUrl}\n\n**R CMD Check:**\n\`\`\`\n${check}\n\`\`\`\n\n**BiocCheck:**\n\`\`\`\n${bioc}\n\`\`\`\n\n**Coverage:**\n${cov}\n\n**Cyclomatic Complexity:**\n${cycloSummary}\n\n**Dependency Load (pkgndep):**\n\`\`\`\n${pkgndep}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: Number('${{ steps.resolve.outputs.issue }}'),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Post pkgndep histogram to issue
        if: >
          always() &&
          steps.pkgndep.outputs.histogram_generated == 'true'
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = Number('${{ steps.resolve.outputs.issue }}');
            const histPath = 'pkgndep_histogram.png';

            if (!fs.existsSync(histPath)) {
              core.warning('pkgndep histogram file not found, skipping image comment.');
              return;
            }

            let imageUrl = null;
            try {
              const imageData = fs.readFileSync(histPath);
              const token = process.env.GITHUB_TOKEN;
              if (!token) {
                core.warning('GITHUB_TOKEN not available, skipping histogram upload.');
                throw new Error('GITHUB_TOKEN is not set');
              }
              const uploadRes = await fetch(
                `https://uploads.github.com/repos/${context.repo.owner}/${context.repo.repo}/issues/${issueNumber}/assets`,
                {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'image/png',
                    'Content-Disposition': 'attachment; filename="pkgndep_histogram.png"',
                  },
                  body: imageData,
                }
              );
              if (uploadRes.ok) {
                const uploadData = await uploadRes.json();
                imageUrl = uploadData.url;
              } else {
                const errText = await uploadRes.text();
                core.warning(`Could not upload histogram image: ${uploadRes.status} ${errText}`);
              }
            } catch (uploadError) {
              core.warning('Could not upload histogram image: ' + uploadError.message);
            }

            let body;
            if (imageUrl) {
              body = [
                '<details>',
                '<summary>📊 Dependency Histogram (pkgndep)</summary>',
                '',
                `![Dependency Histogram](${imageUrl})`,
                '',
                '</details>',
              ].join('\n');
            } else {
              const artifactUrl = '${{ steps.upload-histogram.outputs.artifact-url }}';
              const fallbackUrl = artifactUrl || `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body = [
                '<details>',
                '<summary>📊 Dependency Histogram (pkgndep)</summary>',
                '',
                `The dependency histogram PNG is available as a [workflow run artifact](${fallbackUrl}).`,
                '',
                '</details>',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
